name: Build Giro de Supervisores Windows EXE

on:
  push:
    branches: [giro-customs-pc]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Validate Python syntax
        run: |
          python -m py_compile giro_supervisores_final.py
          python -m py_compile giro_supervisores_launcher_v6.py
          python -m py_compile giro_supervisores_launcher_v7.py
          python -m py_compile giro_supervisores_launcher_v8.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GiroDeSupervisores_NelsonCasella giro_supervisores_launcher_v8.py
      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path 'dist/GiroDeSupervisores_NelsonCasella.exe')) { throw 'No se genero el EXE' }
          Get-Item 'dist/GiroDeSupervisores_NelsonCasella.exe'
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GiroDeSupervisores-NelsonCasella-Windows
          path: dist/GiroDeSupervisores_NelsonCasella.exe
