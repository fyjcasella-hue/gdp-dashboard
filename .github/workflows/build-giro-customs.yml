name: Build Giro Customs Windows EXE

on:
  push:
    branches: [giro-customs-pc]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Validate Python syntax
        run: python -m py_compile giro_customs_final.py
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GiroCustoms giro_customs_final.py
      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path 'dist/GiroCustoms.exe')) { throw 'No se generó dist/GiroCustoms.exe' }
          Get-Item 'dist/GiroCustoms.exe'
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GiroCustoms-Windows
          path: dist/GiroCustoms.exe
